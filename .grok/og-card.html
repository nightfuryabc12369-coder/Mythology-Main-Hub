<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Aether Codex</title>
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("./fonts/Cinzel-var.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #110e0b;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #110e0b;
    }
    svg.scene {
      position: absolute;
      inset: 0;
      width: 1200px;
      height: 630px;
      display: block;
    }
    .lockup {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-62%);
      text-align: center;
      z-index: 2;
      color: #f6efe2;
    }
    .line {
      font-family: "Cinzel", "Liberation Serif", serif;
      font-weight: 560;
      font-size: 100px;
      line-height: 0.86;
      letter-spacing: 0.30em;
      text-indent: 0.30em;
      margin: 0 auto;
      width: fit-content;
      color: #f6efe2;
      text-shadow:
        0 2px 0 rgba(17, 14, 11, 0.45),
        0 10px 28px rgba(17, 14, 11, 0.72);
    }
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 280px;
      margin: 16px auto 14px;
    }
    .ornament .bar {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c4a35a, transparent);
    }
    .ornament .diamond {
      width: 7px;
      height: 7px;
      background: #a33b42;
      transform: rotate(45deg);
      box-shadow: 0 0 0 1px #c4a35a;
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg class="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2c2418"/>
          <stop offset="38%" stop-color="#1a1510"/>
          <stop offset="100%" stop-color="#110e0b"/>
        </linearGradient>
        <radialGradient id="storm" cx="62%" cy="18%" r="58%">
          <stop offset="0%" stop-color="#f3e6c4" stop-opacity="0.85"/>
          <stop offset="18%" stop-color="#c4a35a" stop-opacity="0.38"/>
          <stop offset="46%" stop-color="#8a6230" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#110e0b" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="scrim" cx="50%" cy="46%" r="48%">
          <stop offset="0%" stop-color="#110e0b" stop-opacity="0.62"/>
          <stop offset="55%" stop-color="#110e0b" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#110e0b" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fbf7ef"/>
          <stop offset="42%" stop-color="#e6d9c4"/>
          <stop offset="100%" stop-color="#b7a78e"/>
        </linearGradient>
        <linearGradient id="marbleV" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#cbbfa8"/>
          <stop offset="22%" stop-color="#f7f1e6"/>
          <stop offset="58%" stop-color="#e4d5bf"/>
          <stop offset="100%" stop-color="#a89880"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4e7c4"/>
          <stop offset="45%" stop-color="#c4a35a"/>
          <stop offset="100%" stop-color="#7c6232"/>
        </linearGradient>
        <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#c4555c"/>
          <stop offset="100%" stop-color="#6e242b"/>
        </linearGradient>
        <filter id="mist" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="18"/>
        </filter>
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0" result="g"/>
          <feComponentTransfer in="g">
            <feFuncA type="linear" slope="0.16"/>
          </feComponentTransfer>
        </filter>
        <g id="leaf">
          <path fill="#c4a35a" d="M0 0C7-11 20-13 28-2 18 5 8 6 0 0Z"/>
          <path d="M3 0.2L22-1" stroke="#7c6232" stroke-width="0.6" fill="none"/>
        </g>
      </defs>

      <rect width="1200" height="630" fill="#110e0b"/>
      <rect width="1200" height="630" fill="url(#sky)"/>
      <rect width="1200" height="630" fill="url(#storm)"/>

      <!-- god-rays -->
      <g opacity="0.16" fill="url(#gold)">
        <polygon points="760,0 800,0 620,630 540,630"/>
        <polygon points="860,0 888,0 980,630 900,630"/>
        <polygon points="700,0 718,0 500,630 450,630"/>
      </g>

      <!-- distant olympus -->
      <path fill="#1c1814" d="M0 630V392l68-28 62 42 70-128 78 62 92 108 150 28 140-18 96-78 78-92 62 48 58-36 46 42V630Z"/>
      <path fill="#14110e" opacity="0.9" d="M0 630V470l90-20 120 36 160-10 180 24 150-30 140 18 120-40 90 22 50 16V630Z"/>
      <!-- storm-lit ridge -->
      <path d="M900 392l78-92 62 48" fill="none" stroke="#e7d3a2" stroke-width="1.4" opacity="0.7"/>
      <path d="M190 278l78 62" fill="none" stroke="#c4a35a" stroke-width="1" opacity="0.35"/>

      <!-- parchment mist in the valley -->
      <ellipse cx="600" cy="520" rx="340" ry="46" fill="#f6efe2" opacity="0.08" filter="url(#mist)"/>

      <!-- temple -->
      <g>
        <!-- pediment -->
        <polygon points="392,508 600,448 808,508" fill="none" stroke="url(#marble)" stroke-width="12" stroke-linejoin="miter"/>
        <polygon points="392,508 600,448 808,508" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linejoin="miter"/>
        <g transform="translate(600,442)" fill="url(#gold)">
          <ellipse cx="0" cy="2" rx="5" ry="7"/>
          <path d="M0 2C-8-10-4-22 0-26 4-22 8-10 0 2Z"/>
          <path d="M0 0C-14-4-20-14-16-18-8-12-4-6 0 0Z"/>
          <path d="M0 0C14-4 20-14 16-18 8-12 4-6 0 0Z"/>
        </g>
        <rect x="378" y="508" width="444" height="14" fill="url(#marble)"/>
        <rect x="378" y="508" width="444" height="2" fill="#c4a35a"/>
        <rect x="378" y="520" width="444" height="2" fill="#8a7040"/>
        <g fill="url(#marbleV)">
          <g>
            <rect x="404" y="522" width="40" height="7" fill="url(#gold)"/>
            <rect x="410" y="529" width="28" height="58"/>
            <rect x="414" y="529" width="3" height="58" fill="#000" opacity="0.1"/>
            <rect x="424" y="529" width="3" height="58" fill="#fff" opacity="0.28"/>
            <rect x="404" y="587" width="40" height="6" fill="#d9cbb3"/>
          </g>
          <g>
            <rect x="478" y="522" width="40" height="7" fill="url(#gold)"/>
            <rect x="484" y="529" width="28" height="58"/>
            <rect x="488" y="529" width="3" height="58" fill="#000" opacity="0.1"/>
            <rect x="498" y="529" width="3" height="58" fill="#fff" opacity="0.28"/>
            <rect x="478" y="587" width="40" height="6" fill="#d9cbb3"/>
          </g>
          <g>
            <rect x="552" y="522" width="40" height="7" fill="url(#gold)"/>
            <rect x="558" y="529" width="28" height="58"/>
            <rect x="562" y="529" width="3" height="58" fill="#000" opacity="0.1"/>
            <rect x="572" y="529" width="3" height="58" fill="#fff" opacity="0.28"/>
            <rect x="552" y="587" width="40" height="6" fill="#d9cbb3"/>
          </g>
          <g>
            <rect x="626" y="522" width="40" height="7" fill="url(#gold)"/>
            <rect x="632" y="529" width="28" height="58"/>
            <rect x="636" y="529" width="3" height="58" fill="#000" opacity="0.1"/>
            <rect x="646" y="529" width="3" height="58" fill="#fff" opacity="0.28"/>
            <rect x="626" y="587" width="40" height="6" fill="#d9cbb3"/>
          </g>
          <g>
            <rect x="700" y="522" width="40" height="7" fill="url(#gold)"/>
            <rect x="706" y="529" width="28" height="58"/>
            <rect x="710" y="529" width="3" height="58" fill="#000" opacity="0.1"/>
            <rect x="720" y="529" width="3" height="58" fill="#fff" opacity="0.28"/>
            <rect x="700" y="587" width="40" height="6" fill="#d9cbb3"/>
          </g>
          <g>
            <rect x="774" y="522" width="40" height="7" fill="url(#gold)"/>
            <rect x="780" y="529" width="28" height="58"/>
            <rect x="784" y="529" width="3" height="58" fill="#000" opacity="0.1"/>
            <rect x="794" y="529" width="3" height="58" fill="#fff" opacity="0.28"/>
            <rect x="774" y="587" width="40" height="6" fill="#d9cbb3"/>
          </g>
        </g>
        <rect x="368" y="593" width="464" height="6" fill="#e7dcc8"/>
        <rect x="350" y="599" width="500" height="5" fill="#cfc0a6"/>
        <path d="M792 536c28 8 36 36 22 58 8 6 24 4 30-8 10 18-6 34-24 36-22 2-36-14-38-30-8 8-24 6-30-2 2-20 16-44 40-54z" fill="url(#wine)"/>
        <path d="M806 552c10 14 8 30-2 40" fill="none" stroke="#f6efe2" stroke-opacity="0.25" stroke-width="1"/>
      </g>

      <!-- readability scrim behind the lockup -->
      <ellipse cx="600" cy="292" rx="390" ry="150" fill="url(#scrim)"/>

      <!-- laurel, left -->
      <g transform="translate(132,296)" fill="none" stroke="#c4a35a" stroke-width="1.6" stroke-linecap="round">
        <path d="M70-108C18-78 4-28 18 30c10 40 40 78 86 102"/>
        <g stroke="none">
          <use href="#leaf" transform="translate(62,-100) rotate(-28)"/>
          <use href="#leaf" transform="translate(36,-78) rotate(-48) scale(0.9)"/>
          <use href="#leaf" transform="translate(18,-48) rotate(-66)"/>
          <use href="#leaf" transform="translate(12,-16) rotate(-82) scale(0.92)"/>
          <use href="#leaf" transform="translate(16,16) rotate(-100)"/>
          <use href="#leaf" transform="translate(30,48) rotate(-122) scale(0.9)"/>
          <use href="#leaf" transform="translate(52,76) rotate(-142)"/>
          <use href="#leaf" transform="translate(80,98) rotate(-162) scale(0.85)"/>
        </g>
      </g>
      <!-- laurel, right -->
      <g transform="translate(1068,296) scale(-1,1)" fill="none" stroke="#c4a35a" stroke-width="1.6" stroke-linecap="round">
        <path d="M70-108C18-78 4-28 18 30c10 40 40 78 86 102"/>
        <g stroke="none">
          <use href="#leaf" transform="translate(62,-100) rotate(-28)"/>
          <use href="#leaf" transform="translate(36,-78) rotate(-48) scale(0.9)"/>
          <use href="#leaf" transform="translate(18,-48) rotate(-66)"/>
          <use href="#leaf" transform="translate(12,-16) rotate(-82) scale(0.92)"/>
          <use href="#leaf" transform="translate(16,16) rotate(-100)"/>
          <use href="#leaf" transform="translate(30,48) rotate(-122) scale(0.9)"/>
          <use href="#leaf" transform="translate(52,76) rotate(-142)"/>
          <use href="#leaf" transform="translate(80,98) rotate(-162) scale(0.85)"/>
        </g>
      </g>

      <!-- drifting gold leaves -->
      <use href="#leaf" transform="translate(1010,86) rotate(24) scale(0.7)" opacity="0.85"/>
      <use href="#leaf" transform="translate(1068,128) rotate(70) scale(0.5)" opacity="0.65"/>
      <use href="#leaf" transform="translate(160,110) rotate(-20) scale(0.55)" opacity="0.55"/>

      <!-- plate frame, inset so a cover-crop cannot clip it -->
      <rect x="36" y="28" width="1128" height="574" fill="none" stroke="#c4a35a" stroke-opacity="0.55" stroke-width="1"/>
      <rect x="44" y="36" width="1112" height="558" fill="none" stroke="#f6efe2" stroke-opacity="0.18" stroke-width="1"/>

      <rect width="1200" height="630" filter="url(#grain)" opacity="0.35"/>
    </svg>

    <div class="lockup">
      <p class="line">AETHER</p>
      <div class="ornament" aria-hidden="true"><span class="bar"></span><span class="diamond"></span><span class="bar"></span></div>
      <p class="line">CODEX</p>
    </div>
  </div>
</body>
</html>
